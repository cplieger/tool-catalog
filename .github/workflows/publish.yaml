# Catalog publish: compile the PINNED mise + aqua registry refs
# (registries.env) into tool-catalog.json and cut a dated release. The
# heavy lifting (pin validation, fetch-by-commit, compile, verify,
# skip-if-unchanged, release) lives in scripts/publish.sh so it runs
# identically in CI and locally (DRY_RUN=1). Consumers fetch
# releases/latest/download/tool-catalog.json.
#
# Trigger model: Renovate bumps registries.env (and the lane pin below),
# the automerged PR lands on main, and the push trigger publishes — a
# release follows every upstream registry update at the Renovate sweep
# cadence, when the compiled content changed. Merges touching publish.sh
# or required-floor.txt also run: a floor change compiles and verifies
# the new floor on merge (the floor digest is part of the idempotence
# stamp); a script-only change exercises the script and no-ops at the
# stamp. A run whose catalog matches the latest release's, ignoring its
# build time and ref labels, publishes nothing. The daily cron is a
# SELF-HEAL retry only: it re-publishes when a push-triggered run failed
# mid-flight (GitHub outage, transient fetch failure); after a
# content-identical bump it recompiles and skips until the next bump.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - registries.env
      - .github/workflows/publish.yaml
      - scripts/publish.sh
      - required-floor.txt
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # gh release create (tag + assets)
      actions: write # workflow self-keepalive (see the step below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes with checkout-persisted credentials (gh uses
          # the GH_TOKEN env); do not leave the token in .git/config.
          persist-credentials: false
      # Keepalive: GitHub disables scheduled workflows after 60 days
      # without repository activity, and cron runs themselves do not
      # count as activity. Renovate's registry-pin bumps normally keep
      # the repo active, but if both upstreams (or Renovate itself)
      # went quiet for 60 days the self-heal cron would die silently,
      # so every run re-enables the workflow to reset the inactivity
      # clock (the standard keepalive pattern). Silent publisher death
      # is the failure mode consumers cannot see: they would keep
      # fetching an aging catalog forever.
      - name: Keepalive (reset the 60-day scheduled-workflow timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yaml/enable"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false # nothing to key a module cache on (no go.mod here)
      - name: Compile and publish
        env:
          GH_TOKEN: ${{ github.token }}
          # setup-go exports GOTOOLCHAIN=local, and `go-version: stable` above
          # resolves only from actions/go-versions' manifest, which lags an
          # upstream Go patch tag by hours. A Renovate bump of toolbelt's `go`
          # directive inside that lag makes publish.sh's `go run` refuse with
          # `requires go >= X (running X-1; GOTOOLCHAIN=local)`. `auto` fetches
          # the toolchain as a checksum-verified module; this repo has no go.mod,
          # so nothing here needs a specific compiler.
          GOTOOLCHAIN: auto
          # The depName tracks the CURRENT major; publish.sh derives the module
          # path's suffix from the tag, so a Renovate bump across a major
          # boundary needs no second edit here.
          # renovate: datasource=go depName=github.com/cplieger/toolbelt/v3
          TOOLCATALOG_VERSION: v3.10.1
        run: bash scripts/publish.sh
